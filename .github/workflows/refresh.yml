name: Refresh watchlist

on:
  schedule:
    # Mon & Thu 12:00 UTC (~7am ET). GitHub cron is best-effort; runs can be delayed 15–60 min.
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-watchlist
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # v5 runs on Node 24. node-version below is the runtime for
      # scripts/refresh.mjs and is independent of the action's own runtime.
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Refresh data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/refresh.mjs

      # Founder-pedigree enrichment. Picks its own --limit: 6 normally, 16 in
      # the 4-8 weeks after SpaceX's May 15 / Nov 15 vesting dates, when
      # departures (and therefore new founders) cluster.
      - name: Enrich founder pedigree
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/enrich-pedigree.mjs

      # Guardrails fail the build rather than shipping bad pedigree data: no
      # unsourced or LinkedIn-sourced claims, no unfetched evidence URLs, no
      # score a human can't reproduce from the stored fields.
      - name: Validate pedigree guardrails
        run: node scripts/validate-pedigree.mjs && node scripts/pedigree.test.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/companies.json; then
            echo "No changes to data/companies.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/companies.json
          git commit -m "Refresh watchlist data ($(date -u +%Y-%m-%d))"
          git push
